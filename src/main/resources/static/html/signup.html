<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Let's get signed up</title>

    <link rel = "stylesheet" href = "../css/navbar.css">
    <link rel = "stylesheet" href = "../css/footer.css">
    <style>
        .question-set{
            display: none
        }
    </style>
</head>
<body>
    <div id = "navbar-container"></div>
    <form class = "sign-up-container">
        <p>
            <strong>Name: </strong> <label for="name"></label><input type = "text" id = "name" required />
        </p>
        <p>
            <strong>Birthdate: </strong> <label for="date"></label><input type = "date" id = "date" required />
        </p>
        <p>
            <strong>Sex: </strong>
            <label>
                <select class = "rating">
                    <option value = "M">Male</option>
                    <option value = "F">Female</option>
                </select>
            </label>
        </p>
        <p>
            <strong>Address: </strong> <label for="address"></label><input type = "text" id = "address" required />
        </p>
        <p>
            <strong>Phone Number: </strong> <label for="phoneNo"></label><input type="tel" id = "phoneNo" required />
        </p>
        <p>
            <strong>Email: </strong> <label for="email"></label><input type="email" id = "email" required />
        </p>
        <p>
            <strong>Your photo: </strong> <input type= "file" accept="image/*" id = "photo" required />
        </p>
        <p>
            <strong>Emergency contact name: </strong> <label for="emergencyContactName"></label><input type = "text" id = "emergencyContactName" required />
        </p>
        <p>
            <strong>Emergency contact phone number: </strong> <label for="emergencyContactPhone"></label><input type = "tel" id = "emergencyContactPhone" required />
        </p>
        <p>
            <strong>Your relationship: </strong> <label for="emergencyContactRelationship"></label><input type = "text" id = "emergencyContactRelationship" required />
        </p>

        <p>
            <label for="userType"><strong>I am signing up as a:</strong></label>

            <select id="userType">
                <option value="">Select...</option>
                <option value="coach">Coach</option>
                <option value="client">Client</option>
            </select>
        </p>

        <div id="coachQuestions" class="question-set">
            <label for="specialty"><strong>What's your specialty?</strong></label>
            <select id="specialty">
                <option value="">SELECT...</option>
                <option value="strength">Strength Training</option>
                <option value="weight">Weight Loss</option>
                <option value="rehab">Rehab</option>
                <option value="cardio">Cardio</option>
            </select>
        </div>

        <div id="clientQuestions" class="question-set">
            <p>
                <label for="activityLevel">
                    <strong>What's your activity level?</strong>
                </label>
                <select id="activityLevel">
                    <option value="">SELECT...</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </p>

            <p>
                <label for="fitnessGoal">
                    <strong>What's your fitness goal?</strong>
                </label>
                <select id="fitnessGoal">
                    <option value="">SELECT...</option>
                    <option value="weight-loss">Weight Loss</option>
                    <option value="muscle-gain">Muscle Gain</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="general-health">General Health</option>
                </select>
            </p>

            <p>
                <label for="sleepPattern">
                    <strong>Sleep Quality:</strong>
                </label>
                <select id="sleepPattern" name="sleepPattern">
                    <option value="">SELECT...</option>
                    <option value="POOR">Poor</option>
                    <option value="AVERAGE">Average</option>
                    <option value="GOOD">Good</option>
                </select>
            </p>

            <p>
                <label for="height">
                    <strong>Height (cm):</strong>
                </label>
                <input type="number" id="height" min="50" max="300" step="0.1">
            </p>

            <p>
                <label for="weight">
                    <strong>Weight (kg):</strong>
                </label>
                <input type="number" id="weight" min="20" max="500" step="0.1">
            </p>

            <p>
                <label for="bodyFat">
                    <strong>Body Fat %:</strong>
                </label>
                <input type="number" id="bodyFat" min="0" max="100" step="0.1">
            </p>

            <p>
                <label for="availability">
                    <strong>Availability:</strong>
                </label>
                <input
                        type="text"
                        id="availability"
                        placeholder="Mon/Wed/Fri evenings"
                >
            </p>
        </div>
    </form>
    <div id="footer-container"></div>

    <script src = "../js/components.js"></script>
    <script>
        const userType = document.getElementById("userType");

        userType.addEventListener("change", () => {
            if (userType.value === "coach") {
                document.getElementById("coachQuestions").style.display = "block";

            }

            else if (userType.value === "client") {
                document.getElementById("clientQuestions").style.display = "block";

            }

            else {
                document.getElementById("clientQuestions").style.display = "none";
                document.getElementById("coachQuestions").style.display = "none";
            }
        })
    </script>

</body>
</html>
