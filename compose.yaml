services:
  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MYSQL_DATABASE: grindhub
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    image: grindhub-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mysql

  frontend:
    image: grindhub-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
